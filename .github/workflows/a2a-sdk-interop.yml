name: A2A SDK interoperability

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2a-sdk-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt -r requirements-a2a-interop.txt
      - name: Require official SDK imports
        run: python -c "import a2a.client, httpx"
      - name: Run local A2A protocol tests
        env:
          NO_PROXY: 127.0.0.1,localhost
          no_proxy: 127.0.0.1,localhost
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_a2a_sdk_interop.py::OfficialSdkInteropTests::test_official_sdk_client_discovers_and_uses_local_agent
          tests/test_agents.py::AgentTests::test_a2a_card_message_task_poll_and_message_idempotency
          tests/test_agents.py::AgentTests::test_a2a_task_cancel_is_terminal
          tests/test_agents.py::AgentTests::test_a2a_transport_retry_reuses_idempotent_message
          tests/test_agents.py::AgentTests::test_a2a_rejects_non_object_params
          tests/test_agents.py::AgentTests::test_a2a_deadline_cancels_late_result
